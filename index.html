<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haunted Pairs · Halloween Memory</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <div class="hero-copy">
          <h1>Haunted <span>Pairs</span></h1>
          <p>Every creature has a double. Can you find them all?</p>
        </div>
        <img id="theme-moon" class="theme-moon" src="assets/dusk-moon.png" alt="" width="120" height="90" />
      </header>

      <section class="game" aria-labelledby="board-title">
        <div class="game-heading">
          <h2 id="board-title">The haunted deck</h2>
          <p id="theme-label" class="stage-label">Dusk edition</p>
        </div>
        <div class="game-controls">
          <p>Moves: <span id="moves">0</span></p>
          <p>Pairs: <span id="pairs">0 / 8</span></p>
          <button id="theme-toggle" type="button" aria-pressed="false" title="Toggle midnight mode (N)">Midnight mode</button>
          <button id="restart" type="button">Restart game</button>
        </div>
        <p id="message" role="status">Click a card to reveal its creature.</p>
        <div id="board" class="board" aria-label="Halloween creature cards"></div>
      </section>

      <footer>
        <p>Built with HTML, CSS, JavaScript, and a few friendly ghosts.</p>
      </footer>
    </main>
  </body>
</html>
